<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes de IDIOMIA</title>
</head>
<body>
    <h1>Banderas de los idiomas de IDIOMIA</h1>
    <img src="https://upload.wikimedia.org/wikipedia/en/a/ae/Flag_of_the_United_Kingdom.svg"
        alt="Bandera del Reino Unido - Ingles"
        width="300"
        height="200"
        loading="eager"
    >

    <img src="https://upload.wikimedia.org/wikipedia/en/c/c3/Flag_of_France.svg"
        alt="Bandera de Francia - Frances"
        width="300"
        height="200"
        loading="eager"
    >

    <figure>
        <img src="https://upload.wikimedia.org/wikipedia/en/b/ba/Flag_of_Germany.svg"
            alt="Bandera de Alemania - Aleman"
            width="500"
            height="300"
            loading="lazy"
        >
        <figcaption>Curso de Aleman: nivel basico</figcaption>
    </figure>

    <img src="https://upload.wikimedia.org/wikipedia/en/0/03/Flag_of_Italy.svg"
        alt="Bandera de Italia - Italiano"
        width="300"
        height="200"
        loading="lazy"
    >
</body>
</html>
