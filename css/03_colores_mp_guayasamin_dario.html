<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores - IDIOMIA</title>
    <style>
        body {
            background-color: rgb(30, 41, 59);
        }
        h1 {
            color: gold;
        }
        h2 {
            color: #87CEEB;
        }
        h3 {
            color: rgb(255, 99, 132);
        }
        h4 {
            color: rgba(255, 99, 132, 0.5);
        }
        h5 {
            color: hsl(140, 70%, 50%);
        }
    </style>
</head>
<body>
    <h1>Los colores en distintos idiomas</h1>
    <h1>Por nombre del color: Yellow - Jaune - Gelb</h1>
    <h2>Hexadecimal: Blue - Bleu - Blau</h2>
    <h3>Por valor RGB: Red - Rouge - Rot</h3>
    <h4>Por valor RGBA: Pink - Rose - Rosa</h4>
    <h5>Por valor HSL: Green - Vert - Grün</h5>
</body>
</html>
