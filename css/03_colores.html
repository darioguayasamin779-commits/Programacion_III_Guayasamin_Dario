<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores</title>
    <style>
        body {
            background-color: rgb(94, 94, 223);
        }
        h1 {
            color: darkturquoise;
        }
        h2 {
            color: cornflowerblue;
        }
        h3 {
            color: rgb(78,11,221);
        }   
        h4 {
            color: rgba(78,11,221,0.5);
        }
        h5 {
            color: hsl(240, 80%, 50%);
        }
    </style>
</head>
<body>
    <h1>Manera de establecer colores</h1>
    <h1>Por nombre del color</h1>
    <h2>Hexadecimal</h2>
    <h3>Por valor RGB</h3>
    <h4>Por valor RGBA</h4>
    <h5>Por valor HSL</h5>
</body>
</html>
