<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/01_incluir.js">
        alert('corre, Morty al inicio de pagina');
        console.log('Saludo desde el inicio de pagina')
    </script>
</head>
<body>
    <h1> Incluir JavaScript en HTML5</h1>
    <h2>Modo Inline</h2>
    <button onclick="alert('Hola Mundo')">mostrar mensaje</button>
    <input type="text"
        oninput="console.log(this.value)"
        placeholder="Escribe algo">
    <input type="text"
        onchange="console.log('Valor final guardado: ', this.value)"
        placeholder="Escribe y haz click afuera">
    <input type="text"
        onfocus="console.log(this.value)"
        onblur="alert('Atencion saliste del campo')"
        placeholder="haz click dentro y fuera">
    <script src="01_incluir.js"></script>
</body>
</html>
